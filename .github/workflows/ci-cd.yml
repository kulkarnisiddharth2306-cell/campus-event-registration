name: CI/CD Pipeline

# ==============================================================================
# ANTI-GRAVITY Portal CI/CD Pipeline
# Cloud Computing & DevOps CCA 2
# ------------------------------------------------------------------------------
# 1. Triggers automatically on pushes to the 'main' branch and pull requests.
# 2. Runs automated code quality checks (ESLint) and unit tests (node:test).
# 3. Securely triggers Render Web Service deployment hook only after checks pass.
# ==============================================================================

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ----------------------------------------------------------------------------
  # Quality Assurance Job: Linting & Automated Tests
  # ----------------------------------------------------------------------------
  quality-checks:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out repository code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20 environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies (clean install)
        run: npm ci

      - name: 4. Run ESLint code quality check
        run: npm run lint

      - name: 5. Execute automated test suite (node:test)
        run: npm test

  # ----------------------------------------------------------------------------
  # Continuous Deployment Job: Render Webhook
  # Runs ONLY when:
  # - Quality checks pass successfully
  # - Event is a push to 'main' branch (not pull request)
  # ----------------------------------------------------------------------------
  deploy-to-render:
    name: Deploy Web Service to Render
    needs: quality-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK secret is not set in GitHub repository settings!"
            echo "To configure: GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

          echo "Triggering Render deployment webhook..."
          HTTP_RESPONSE=$(curl -s -o response.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")

          if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 300 ]; then
            echo "SUCCESS: Render deploy hook triggered successfully (HTTP $HTTP_RESPONSE)."
          else
            echo "ERROR: Render deploy hook failed with status code $HTTP_RESPONSE."
            cat response.txt
            exit 1
          fi
